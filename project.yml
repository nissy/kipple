name: Kipple
options:
  bundleIdPrefix: com.nissy
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: bottom
  developmentLanguage: en
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    DEVELOPMENT_TEAM: R7LKF73J2W
    MARKETING_VERSION: 2.2.3
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_NAME: Kipple
    APP_PRODUCT_BUNDLE_IDENTIFIER: com.nissy.Kipple
    TEST_PRODUCT_BUNDLE_IDENTIFIER: com.nissy.KippleTests
    MACOSX_DEPLOYMENT_TARGET: 27.0
    ARCHS: arm64
    SWIFT_VERSION: 6.0
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    COMBINE_HIDPI_IMAGES: YES

packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    # Fix nested initialize capabilities (upstream PR #276); use a release once included.
    revision: f7077e0d5cd57e0b2a497862017aa94ee344252f
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 6.2.2

targets:
  Kipple:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Kipple
        excludes:
          - "**/.DS_Store"
          - "**/Thumbs.db"
          - "Resources/**/*.gitkeep"
    resources:
      - path: Kipple/Resources
        includes:
          - "**/*.xcassets"
          - "**/*.xcdatamodeld"
          - "**/*.xcprivacy"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleName: Kipple
        INFOPLIST_KEY_CFBundleDisplayName: Kipple
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2025 Kipple. All rights reserved.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_PRODUCT_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Kipple/Kipple.entitlements
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime"
    dependencies:
      - target: KippleMCP
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - sdk: libsqlite3.tbd
      - package: Yams
    preBuildScripts: []
    postBuildScripts: []

  KippleMCP:
    type: tool
    platform: macOS
    sources:
      - path: KippleMCP
      - path: Shared
    dependencies:
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: KippleMCP
        PRODUCT_BUNDLE_IDENTIFIER: com.nissy.KippleMCP
        CODE_SIGN_ENTITLEMENTS: KippleMCP/KippleMCP.entitlements
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO

  KippleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KippleTests
        includes:
          - "**/*.swift"
    dependencies:
      - target: Kipple
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kipple.app/Contents/MacOS/Kipple
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(TEST_PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: KippleTests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO


schemes:
  Kipple:
    build:
      targets:
        Kipple: all
        KippleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KippleTests
        # UI tests are temporarily disabled due to runner crash
        # - KippleUITests
      gatherCoverageData: true
      coverageTargets:
        - Kipple
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
