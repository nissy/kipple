name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SwiftLint 0.61.0
        run: |
          archive="$RUNNER_TEMP/portable_swiftlint.zip"
          curl -fsSL https://github.com/realm/SwiftLint/releases/download/0.61.0/portable_swiftlint.zip -o "$archive"
          printf '%s  %s\n' 2342f3784307a02117e18f745fcd350c6acc6cab0e521c0c0e01c32a53a3b274 "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/swiftlint"
          printf '%s\n' "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Run lint
        run: make lint SWIFTLINT_FLAGS=--strict

  test:
    name: Test
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run all tests
        # The hosted VM has no Neural Engine. Exercise Vision via its CPU device.
        run: make test TEST_ADHOC_SIGNING=1 TEST_TIMEOUT=180 TEST_VISION_CPU_ONLY=1
